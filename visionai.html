<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="VisionAI — intelligent assistance built into the ProVision platform."
  />

  <meta
    name="theme-color"
    content="#081826"
  />

  <title>VisionAI — ProVision</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="visionai.css?v=1"
  />
</head>

<body>

  <div class="app-shell">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-top">

        <a
          class="brand"
          href="index.html"
          aria-label="Return to ProVision"
        >
          <img
            class="brand-logo"
            src="provision-logo.png"
            alt="ProVision"
          />
        </a>

        <button
          class="sidebar-close"
          id="sidebarClose"
          type="button"
          aria-label="Close sidebar"
        >
          ×
        </button>

      </div>


      <div class="product-label">
        VisionAI
      </div>


      <button
        class="new-chat-button"
        id="newChatButton"
        type="button"
      >
        <span class="new-chat-plus">
          +
        </span>

        <span>
          New chat
        </span>
      </button>


      <nav
        class="sidebar-navigation"
        aria-label="VisionAI navigation"
      >

        <button
          class="sidebar-link active"
          type="button"
          data-section="chat"
        >
          <span class="sidebar-icon">
            ◇
          </span>

          <span>
            Chat
          </span>
        </button>


        <button
          class="sidebar-link"
          type="button"
          data-section="history"
        >
          <span class="sidebar-icon">
            ◷
          </span>

          <span>
            History
          </span>
        </button>


        <button
          class="sidebar-link"
          type="button"
          data-section="saved"
        >
          <span class="sidebar-icon">
            ☆
          </span>

          <span>
            Saved
          </span>
        </button>


        <button
          class="sidebar-link"
          type="button"
          data-section="files"
        >
          <span class="sidebar-icon">
            ▱
          </span>

          <span>
            Files
          </span>
        </button>

      </nav>


      <div class="sidebar-spacer"></div>


      <div class="sidebar-bottom">

        <div class="sidebar-status">

          <span class="status-dot"></span>

          <div>
            <strong>
              VisionAI
            </strong>

            <span>
              ProVision platform
            </span>
          </div>

        </div>


        <a
          class="back-link"
          href="index.html"
        >
          ← Back to ProVision
        </a>

      </div>

    </aside>



    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

      <!-- =========================
           TOPBAR
      ========================== -->

      <header class="topbar">

        <div class="topbar-left">

          <button
            class="mobile-menu-button"
            id="mobileMenuButton"
            type="button"
            aria-label="Open sidebar"
          >
            <span></span>
            <span></span>
          </button>


          <div class="vision-title">

            <strong>
              VisionAI
            </strong>

            <span>
              ProVision
            </span>

          </div>

        </div>


        <div class="topbar-right">

          <button
            class="model-button"
            id="modelButton"
            type="button"
            disabled
          >
            <span class="model-indicator"></span>

            VisionAI

            <span class="model-chevron">
              ▾
            </span>
          </button>


          <button
            class="profile-button"
            type="button"
            aria-label="Profile"
          >
            PV
          </button>

        </div>

      </header>



      <!-- =========================
           CHAT AREA
      ========================== -->

      <section
        class="chat-area"
        id="chatArea"
      >

        <!-- =========================
             EMPTY / START SCREEN
        ========================== -->

        <div
          class="welcome-screen"
          id="welcomeScreen"
        >

          <div class="welcome-content">

            <div class="vision-mark">
              V
            </div>

            <p class="welcome-eyebrow">
              VisionAI
            </p>

            <h1>
              What can VisionAI help you accomplish?
            </h1>

            <p class="welcome-description">
              Write, plan, create, research, and work across the
              ProVision platform from one intelligent workspace.
            </p>


            <div class="starter-grid">

              <button
                class="starter-card"
                type="button"
                data-prompt="Help me write something."
              >
                <span class="starter-label">
                  Write
                </span>

                <strong>
                  Turn ideas into clear writing.
                </strong>
              </button>


              <button
                class="starter-card"
                type="button"
                data-prompt="Help me research a topic."
              >
                <span class="starter-label">
                  Research
                </span>

                <strong>
                  Explore a topic and organize what matters.
                </strong>
              </button>


              <button
                class="starter-card"
                type="button"
                data-prompt="Help me plan something."
              >
                <span class="starter-label">
                  Plan
                </span>

                <strong>
                  Build a useful plan from an idea.
                </strong>
              </button>


              <button
                class="starter-card"
                type="button"
                data-prompt="Help me create something."
              >
                <span class="starter-label">
                  Create
                </span>

                <strong>
                  Develop concepts, projects, and new ideas.
                </strong>
              </button>

            </div>

          </div>

        </div>



        <!-- =========================
             MESSAGES
        ========================== -->

        <div
          class="messages"
          id="messages"
          aria-live="polite"
        ></div>

      </section>



      <!-- =========================
           COMPOSER
      ========================== -->

      <footer class="composer-area">

        <div class="composer-wrap">

          <form
            class="composer"
            id="chatForm"
          >

            <textarea
              id="messageInput"
              placeholder="Message VisionAI"
              rows="1"
              aria-label="Message VisionAI"
            ></textarea>


            <div class="composer-bottom">

              <div class="composer-tools">

                <button
                  class="tool-button"
                  type="button"
                  aria-label="Attach file"
                  disabled
                >
                  +
                </button>

                <span class="composer-hint">
                  VisionAI
                </span>

              </div>


              <button
                class="send-button"
                id="sendButton"
                type="submit"
                aria-label="Send message"
                disabled
              >
                ↑
              </button>

            </div>

          </form>


          <p class="composer-note">
            VisionAI can make mistakes. Check important information.
          </p>

        </div>

      </footer>

    </main>

  </div>


  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
  ></div>


  <script
    src="visionai.js?v=1"
  ></script>

</body>
</html>
